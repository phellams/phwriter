package_managers:
  - name: "PowerShell Gallery"
    command: "Install-Module -Name PHWriter -Scope CurrentUser -Force"
    url: "https://www.powershellgallery.com/packages/PHWriter"
    desc: "The easiest way to install PHWriter. Works on Windows, macOS, and Linux."
  - name: "Chocolatey (Windows)"
    command: "choco install phwriter"
    url: "https://chocolatey.org/packages/phwriter"
    desc: "Chocolatey repository package for Windows system-wide environments."
  - name: "GitLab NuGet Registry"
    command: "nuget install PHWriter -Source \"https://gitlab.com/api/v4/projects/71983492/packages/nuget/index.json\""
    url: "https://gitlab.com/phellams/phwriter/-/packages"
    desc: "Enterprise package distribution repository integration."

manual_downloads:
  - format: "ZIP Archive"
    filename: "phwriter-v2.0.0.zip"
    url: "https://gitlab.com/phellams/phwriter/-/archive/v2.0.0/phwriter-v2.0.0.zip"
    desc: "Complete module source folder structure"
  - format: "TAR Ball"
    filename: "phwriter-v2.0.0.tar.gz"
    url: "https://gitlab.com/phellams/phwriter/-/archive/v2.0.0/phwriter-v2.0.0.tar.gz"
    desc: "Gzipped source code for Linux/macOS"
  - format: "NuGet Package"
    filename: "phwriter.2.0.0.nupkg"
    url: "https://gitlab.com/api/v4/projects/71983492/packages/generic/phwriter/2.0.0/phwriter.2.0.0.nupkg"
    desc: "`.nupkg` package for pipeline repositories"
