<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | {{ site.title }}</title>
    <link rel="icon" href="https://raw.githubusercontent.com/phellams/phellams-general-resources/main/logos/phwriter/dist/png/phwriter-logo-128x128.png">
    <link rel="stylesheet" href="{{ '/assets/css/just-the-docs-default.css' | relative_url }}">
  </head>
  <body class="ph-splash">
    <div class="ph-splash__container">
      <header class="ph-splash__header">
        <a class="ph-splash__brand" href="{{ '/' | relative_url }}" aria-label="PHWriter home">
          <img src="https://raw.githubusercontent.com/phellams/phellams-general-resources/main/logos/phwriter/dist/png/phwriter-logo-128x128.png" width="48" height="48" alt="">
          <span>PHWriter</span>
        </a>
        <a class="ph-button" href="{{ '/downloads.html' | relative_url }}">Get started</a>
      </header>

      <main id="main-content" class="ph-splash__content">
        {{ content }}
      </main>

      <footer class="ph-splash__footer">
        © 2026 Phellams Automation. Distributed under the MIT License.
      </footer>
    </div>
  </body>
</html>
