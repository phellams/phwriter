<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | {{ site.title }}</title>
    <link rel="icon" href="https://raw.githubusercontent.com/phellams/phellams-general-resources/main/logos/phwriter/dist/png/phwriter-logo-128x128.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/just-the-docs-default.css' | relative_url }}">
  </head>
  <body class="ph-splash">
    {% if site.enable_copy_code_button %}
      {% include icons/icons.html %}
    {% endif %}
    <div class="ph-splash__container">
      <main id="main-content" class="ph-splash__content">
        {{ content }}
      </main>

      <footer class="ph-splash__footer">
        © 2026 Phellams Automation. Distributed under the MIT License.
      </footer>
    </div>
    <script src="{{ '/assets/js/just-the-docs.js' | relative_url }}" defer></script>
    <script defer>
      document.addEventListener('DOMContentLoaded', function () {
        var labels = {
          bash: 'Bash', css: 'CSS', html: 'HTML', javascript: 'JavaScript', json: 'JSON',
          powershell: 'PowerShell', pwsh: 'PowerShell', typescript: 'TypeScript', yaml: 'YAML', yml: 'YAML'
        };

        document.querySelectorAll('div.highlighter-rouge').forEach(function (block) {
          var languageClass = Array.from(block.classList).find(function (className) {
            return className.indexOf('language-') === 0;
          });

          if (languageClass) {
            var language = languageClass.substring('language-'.length).toLowerCase();
            block.dataset.language = labels[language] || language;
          }
        });
      });
    </script>
  </body>
</html>
