<details class="ph-theme-variant">
  <summary><code>{{ include.theme.name }}</code><span>{{ include.theme.desc | default: include.theme.style | default: include.theme.direction }}</span></summary>
  <div class="ph-theme-variant__variants">
    {% assign variants = 'Base,Rounded,Double,Gradient' | split: ',' %}
    {% for variant in variants %}
    {% assign variant_slug = variant | downcase %}
    <figure class="ph-theme-preview-card">
      <img loading="lazy" src="./assets/themes-previews/{{ include.theme.name }}/{{ variant_slug }}.gif" width="960" height="600" alt="{{ variant }} preview of the {{ include.theme.name }} PHWriter theme">
      <figcaption>
        <strong>{{ variant }}</strong>
        <code>New-PHWriter @metadata -Theme '{{ include.theme.name }}' -Layout Minimal -Compact{% if variant == 'Rounded' %} -OuterBorder{% elsif variant == 'Double' %} -OuterBorder -OuterBorderStyle Double{% elsif variant == 'Gradient' %} -Gradient -CustomGradient 39,51,129,201 -OuterBorder -BorderGradient -BorderCustomGradient 39,51,129,201{% endif %}</code>
      </figcaption>
    </figure>
    {% endfor %}
  </div>
</details>
